[package]
name = "rust_lib_clutter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
env_logger = "0.11.10"
flutter_rust_bridge = "=2.12.0"
log = "0.4.29"
lofty = "0.24"
rusqlite = { version = "0.31", features = ["bundled"] }
symphonia = { version = "0.5.5", features = ["all"] }
uuid = { version = "1.11.0", features = ["v4"] }
russh = { version = "0.62.0", features = ["aws-lc-rs"], optional = true }
walkdir = "2.5"
anyhow = { version = "1", optional = true }
tokio = { version = "1.17.0", features = ["macros"], optional = true }
russh-sftp = { version = "2.3.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
remote-sftp = ["dep:anyhow", "dep:russh", "dep:russh-sftp", "dep:tokio"]

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
