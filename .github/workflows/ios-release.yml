name: ios release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach to'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-ios:
    name: build ipa
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: set up nix
        uses: cachix/install-nix-action@v31

      - name: build ios release
        env:
          IPA_NAME: clutter-${{ env.RELEASE_TAG }}
          BUNDLE_ID: com.chx.clutter
        run: scripts/build_ios_ipa.sh

      - name: upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: clutter-${{ env.RELEASE_TAG }}-ipa
          path: build/ios/clutter-${{ env.RELEASE_TAG }}.ipa
          if-no-files-found: error

      - name: attach ipa to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/ios/clutter-${{ env.RELEASE_TAG }}.ipa
